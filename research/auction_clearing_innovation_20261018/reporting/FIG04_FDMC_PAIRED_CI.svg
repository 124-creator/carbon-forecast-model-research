  <g id="text_21">
   <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243442" x="11.52" y="23.6775" transform="rotate(-0 11.52 23.6775)">FDMC: paired uncertainty against the required controls</text>
  </g>
  <g id="text_22">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243442" x="11.52" y="37.0872" transform="rotate(-0 11.52 37.0872)">Statistic: ratio of aggregate R, where R is the mean of nine within-cell MSE / RW MSE ratios.</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243442" x="11.52" y="59.2776" transform="rotate(-0 11.52 59.2776)">The first five intervals include 1. An interval containing 1 does not establish equivalence or inferiority.</text>
  </g>
  <g id="text_24">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243442" x="11.52" y="394.0632" transform="rotate(-0 11.52 394.0632)">95% paired percentile intervals: 2,000 draws; noncircular 20-origin blocks sampled separately within each year.</text>
  </g>
  <g id="text_25">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243442" x="11.52" y="412.3944" transform="rotate(-0 11.52 412.3944)">All horizons/platforms at an issue date share the same draw weight. Comparators and fitted forecasts remain fixed.</text>
  </g>
  <g id="text_26">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243442" x="11.52" y="430.7256" transform="rotate(-0 11.52 430.7256)">Intervals omit retraining and comparator-selection uncertainty; they are not simultaneous confidence guarantees.</text>
  </g>
  <g id="text_27">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243442" x="11.52" y="449.0568" transform="rotate(-0 11.52 449.0568)">The unseparated contrast supports this scale parameterization only; it does not replace the six failed primary gates.</text>
  </g>
 </g>
