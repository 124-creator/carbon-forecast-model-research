name: Pro forward gain full replay 20261015
on:
  push:
    branches: [research/pro-forward-gain-20261015]
    paths: [.github/workflows/pro-forward-gain-20261015.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install pinned standalone CPU dependencies
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Execute fixed protocol and both test modes
        run: |
          R=research/pro_forward_gain_20261015
          python -B "$R/run_all.py" --out "$R/results_remote" --workers 2 > /tmp/stageO-full.log 2>&1
      - name: Persist complete new results without overwriting prior runs
        run: |
          R=research/pro_forward_gain_20261015
          cp /tmp/stageO-full.log "$R/results_remote/FULL_EXECUTION.log"
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          r=Path('research/pro_forward_gain_20261015/results_remote')
          (r/'REMOTE_EXECUTION.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'executed_commit':os.environ['GITHUB_SHA'],'execution_completed':True,'scope':'Numerical equivalence and scientific validity require separate checks'},indent=2)+'\n')
          entries=[{'path':str(p.relative_to(r)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(r.rglob('*')) if p.is_file() and p.name!='RESULT_MANIFEST.json']
          (r/'RESULT_MANIFEST.json').write_text(json.dumps({'files':entries,'manifest_excluded':True},indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$R/results_remote"
          git commit -m 'Archive Stage O full forecasts, spectral projectors, fitted coefficients and traces [skip ci]'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Upload full snapshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-forward-gain-complete-20261015
          retention-days: 14
          path: |
            research/pro_forward_gain_20261015
            /tmp/stageO-full.log
