name: Pro renewal response full replay 20261015
on:
  push:
    branches: [research/pro-renewal-response-20261015]
    paths: [.github/workflows/pro-renewal-response-20261015.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install pinned CPU-only dependencies
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Execute fixed protocol and prefit tests
        run: |
          R=research/pro_renewal_response_20261015
          python -B -O -m unittest discover -s "$R" -p test_core.py -v > /tmp/stageM-tests-O.log 2>&1
          python -B "$R/run_all.py" --out "$R/results_remote" --workers 2 > /tmp/stageM-full.log 2>&1
      - name: Archive complete numeric records in this branch
        run: |
          R=research/pro_renewal_response_20261015
          cp /tmp/stageM-tests-O.log "$R/results_remote/TESTS_OPTIMIZED.log"
          cp /tmp/stageM-full.log "$R/results_remote/FULL_EXECUTION.log"
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          r=Path('research/pro_renewal_response_20261015/results_remote')
          (r/'REMOTE_EXECUTION.json').write_text(json.dumps({'workflow_run_id':os.environ['GITHUB_RUN_ID'],'executed_commit':os.environ['GITHUB_SHA'],'full_execution_completed':True,'scope':'Complete fresh execution; numerical equivalence must be checked separately'},indent=2)+'\n')
          entries=[{'path':str(p.relative_to(r)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(r.rglob('*')) if p.is_file() and p.name!='RESULT_MANIFEST.json']
          (r/'RESULT_MANIFEST.json').write_text(json.dumps({'files':entries,'manifest_excluded':True},indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME"
          git reset --soft "origin/$GITHUB_REF_NAME"
          git add "$R/results_remote"
          git commit -m 'Archive complete Stage M forecasts, age mass, parameters and logs [skip ci]'
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Upload full replay snapshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-renewal-response-complete-20261015
          retention-days: 14
          path: |
            research/pro_renewal_response_20261015
            /tmp/stageM-full.log
            /tmp/stageM-tests-O.log
